<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#007BFF" />
        <meta name="description" content="Relia — CRM de prospection, relances et pipeline commercial" />

        <!-- Favicon SVG (moderne, tous navigateurs) -->
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
        <!-- Fallback ICO pour anciens navigateurs -->
        <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />

        <title>Relia</title>

        <script>
            // Supprime les erreurs DataCloneError non critiques liées aux PerformanceServerTiming
            window.addEventListener("error", function (e) {
                if (
                    e.error instanceof DOMException &&
                    e.error.name === "DataCloneError" &&
                    e.message &&
                    e.message.includes("PerformanceServerTiming")
                ) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }, true);
        </script>
    </head>
    <body>
        <noscript>JavaScript est requis pour utiliser cette application.</noscript>
        <div id="root"></div>
    </body>
</html>
